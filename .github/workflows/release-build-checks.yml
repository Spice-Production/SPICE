name: Release Build Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-build-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-linux-rpm:
    name: Classic wrapper RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install Dependencies
        run: npm ci

      - name: Test desktop release configuration
        run: npm test

      - name: Build classic wrapper RPM
        run: npx electron-builder --linux rpm --publish never

  wrapper-macos:
    name: Classic wrapper macOS universal package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test desktop release configuration
        run: npm test

      - name: Package universal macOS app
        run: npm run dist:mac -- --dir --publish never

      - name: Verify Intel and Apple Silicon slices
        run: |
          APP_EXECUTABLE='dist/mac-universal/Spice.app/Contents/MacOS/Spice'
          ARCHITECTURES="$(lipo -archs "$APP_EXECUTABLE")"
          [[ "$ARCHITECTURES" == *x86_64* ]]
          [[ "$ARCHITECTURES" == *arm64* ]]

  native-windows:
    name: Windows Native package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Prepare in-repository Windows runtime
        run: npm run native:prepare-runtime

      - name: Package Windows Native app
        run: npx electron-builder --win --dir --config electron-builder.native.cjs

  native-macos:
    name: macOS Native universal package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Package universal macOS Native app
        run: npm run dist:native:mac -- --dir --publish never

      - name: Verify Native app and runtime slices
        run: |
          APP_ROOT='dist-native/mac-universal/Spice Native.app'
          APP_EXECUTABLE="$APP_ROOT/Contents/MacOS/Spice Native"
          RUNTIME_FFMPEG="$APP_ROOT/Contents/Resources/native-runtime/spice-local-macos/node_modules/ffmpeg-static/ffmpeg"
          APP_ARCHITECTURES="$(lipo -archs "$APP_EXECUTABLE")"
          FFMPEG_ARCHITECTURES="$(lipo -archs "$RUNTIME_FFMPEG")"
          [[ "$APP_ARCHITECTURES" == *x86_64* ]]
          [[ "$APP_ARCHITECTURES" == *arm64* ]]
          [[ "$FFMPEG_ARCHITECTURES" == *x86_64* ]]
          [[ "$FFMPEG_ARCHITECTURES" == *arm64* ]]

  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Runner cmdline-tools 16+ dropped the legacy "tools" package the action
          # installs by default; the next step installs what the build needs.
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Packages
        run: sdkmanager 'platforms;android-36' 'platform-tools' 'build-tools;36.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile-expo/package-lock.json

      - name: Build Android release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          # The release ships the Expo app under the established Android identity.
          # This workflow only validates the build and never publishes it, so it
          # signs with the debug key; tag releases require the stable key.
          SPICE_ANDROID_APPLICATION_ID: xyz.spiceapp.mobile
          SPICE_ANDROID_APP_NAME: Spice
          SPICE_ANDROID_ABIS: arm64-v8a,armeabi-v7a
        run: |
          npm --prefix apps/mobile-expo ci
          npm --prefix apps/mobile-expo run android:release

      - name: Verify APK signature and identity
        run: |
          APK=apps/mobile-expo/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -q "^package: name='xyz.spiceapp.mobile' "
