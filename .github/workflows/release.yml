name: Release Spice

on:
  push:
    tags:
      - 'v*' # Trigger automatically when a tag starting with 'v' is pushed (e.g., v1.0.1)
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure GitHub Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          if gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes; then
            exit 0
          fi
          echo "Release creation raced with another workflow; verifying the shared release now exists."
          gh release view "$VERSION" >/dev/null

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    # This grants the workflow permission to create a GitHub Release and upload files
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libdbus-1-dev flatpak flatpak-builder elfutils rpm
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install unified workspace
        run: npm ci

      # Builds and publishes depending on the runner OS
      - name: Build & Publish Release (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Release (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile-android:
    name: Build & Upload Android Release
    needs: prepare-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Runner cmdline-tools 16+ dropped the legacy "tools" package the action
          # installs by default; the next step installs what the build needs.
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Packages
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Decode Android Signing Key
        env:
          SPICE_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPICE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SPICE_ANDROID_KEYSTORE_BASE64" ]; then
            echo "SPICE_ANDROID_KEYSTORE_BASE64 is required for a stable signed Android release."
            exit 1
          fi
          printf '%s' "$SPICE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spice-release.jks"
          test -s "$RUNNER_TEMP/spice-release.jks"

      - name: Build Android Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          SPICE_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/spice-release.jks
          SPICE_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.SPICE_ANDROID_KEYSTORE_PASSWORD }}
          SPICE_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.SPICE_ANDROID_KEY_ALIAS }}
          SPICE_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.SPICE_ANDROID_KEY_PASSWORD }}
          # The Expo app ships under the established Android identity, so it
          # installs over the Kotlin app and imports its data.
          SPICE_ANDROID_APPLICATION_ID: xyz.spiceapp.mobile
          SPICE_ANDROID_APP_NAME: Spice
          SPICE_ANDROID_ABIS: arm64-v8a,armeabi-v7a
          SPICE_ANDROID_REQUIRE_RELEASE_SIGNING: '1'
        run: |
          npm --prefix apps/mobile-expo ci
          npm --prefix apps/mobile-expo run check
          npm --prefix apps/mobile-expo run android:engine:test
          npm --prefix apps/mobile-expo run android:release

      - name: Stage Android Release APK
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          SIGNED_APK="apps/mobile-expo/android/app/build/outputs/apk/release/app-release.apk"
          ASSET_DIR="dist-mobile"
          if [ -f "$SIGNED_APK" ]; then
            APK="$SIGNED_APK"
            SIGNING_KIND="signed"
          else
            echo "Expected signed release APK not found."
            find apps/mobile-expo/android/app/build/outputs -type f || true
            exit 1
          fi
          ASSET="$ASSET_DIR/Spice-Android-${VERSION}-release-${SIGNING_KIND}.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected release APK not found at $APK"
            find apps/mobile-expo/android/app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p "$ASSET_DIR"
          cp "$APK" "$ASSET"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spice-android-release-apk
          path: dist-mobile/*.apk
          if-no-files-found: error

      - name: Upload Android APK To GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release upload "$VERSION" dist-mobile/*.apk --clobber
